services:
  database:
    image: postgres:15-alpine
    container_name: orbis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: orbis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbis-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword@database:5432/orbis?schema=public
      AUTH0_ISSUER_BASE_URL: https://dev-dummy.auth0.com/
      AUTH0_AUDIENCE: https://api.orbis.com
    depends_on:
      - database
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SUPABASE_URL: "https://dummy-project.supabase.co"
        VITE_SUPABASE_ANON_KEY: "dummy-anon-key"
        VITE_SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
    container_name: orbis-frontend
    networks:
      - frontend-network
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: orbis-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend-network
    restart: unless-stopped

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  postgres_data:
